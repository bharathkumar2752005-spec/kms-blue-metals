<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register | K.M.S Blue Metals</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      padding: 40px 0;
    }

    /* Login/Register Page Styles */
    .flash-messages {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .flash-message {
      padding: 12px 24px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.5s ease-in-out;
    }

    .flash-success {
      background-color: #4CAF50;
    }

    .flash-error {
      background-color: #f44336;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-container {
      max-width: 500px;
      width: 90%;
      margin: 0 auto;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      position: relative;
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    .auth-container:hover {
      transform: translateY(-5px);
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #ff7e5f, #feb47b, #7b68ee, #00c6ff);
      background-size: 300% 300%;
      animation: gradientBorder 6s ease infinite;
    }

    @keyframes gradientBorder {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .auth-tabs {
      display: flex;
      background-color: #f7f9fc;
      border-bottom: 1px solid #eaedf3;
    }

    .auth-tab {
      flex: 1;
      padding: 18px 15px;
      text-align: center;
      font-weight: 600;
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #7f8897;
      position: relative;
      overflow: hidden;
    }

    .auth-tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .auth-tab:hover {
      color: #485563;
    }

    .auth-tab.active {
      color: #485563;
    }

    .auth-tab.active::after {
      width: 80%;
    }

    .auth-form {
      padding: 35px;
      display: none;
    }

    .auth-form.active {
      display: block;
      animation: fadeIn 0.5s ease-in-out;
    }

    .auth-form h2 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #485563;
      text-align: center;
      background: linear-gradient(90deg, #5e72e4, #825ee4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      text-align: center;
      color: #7f8897;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
      color: #485563;
      font-size: 15px;
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      border: 2px solid #eaedf3;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
      background-color: #f7f9fc;
      color: #485563;
    }

    .input-with-icon input:focus {
      border-color: #5e72e4;
      box-shadow: 0 0 0 3px rgba(94, 114, 228, 0.1);
      outline: none;
      background-color: #ffffff;
    }

    .input-with-icon input::placeholder {
      color: #adb5bd;
    }

    .input-with-icon i:first-child {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #adb5bd;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .input-with-icon input:focus + i {
      color: #5e72e4;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #adb5bd;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-password:hover {
      color: #5e72e4;
    }

    .btn-auth {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      margin: 10px 0 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #5e72e4, #825ee4);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(94, 114, 228, 0.3);
    }

    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(94, 114, 228, 0.4);
    }

    .btn-auth:active {
      transform: translateY(0);
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      body {
        padding: 20px 0;
      }
      
      .auth-container {
        width: 95%;
        border-radius: 15px;
      }
      
      .auth-form {
        padding: 25px 20px;
      }
      
      .auth-form h2 {
        font-size: 24px;
      }
      
      .input-with-icon input {
        padding: 12px 15px 12px 40px;
      }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash-message flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Register</button>
    </div>

    <!-- Login Form -->
    <div class="auth-form active" id="login-form">
      <h2>Welcome Back!</h2>
      <p class="auth-subtitle">Login to access your K.M.S Blue Metals account</p>

      <form action="{{ url_for('login') }}" method="post">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-with-icon">
            <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
            <i class="fas fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-with-icon">
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
            <i class="fas fa-lock"></i>
            <i class="toggle-password fas fa-eye" onclick="togglePassword('login-password')"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-auth">Login Now</button>
      </form>
    </div>

    <!-- Register Form -->
    <div class="auth-form" id="register-form">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Join K.M.S Blue Metals for exclusive offers</p>

      <form action="{{ url_for('register') }}" method="post">
        <div class="form-group">
          <label for="register-name">Full Name</label>
          <div class="input-with-icon">
            <input type="text" id="register-name" name="name" placeholder="Enter your full name" required>
            <i class="fas fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="register-email">Email Address</label>
          <div class="input-with-icon">
            <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
            <i class="fas fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="register-address">Address</label>
          <div class="input-with-icon">
            <input type="text" id="register-address" name="address" placeholder="Enter your address" required>
            <i class="fas fa-map-marker-alt"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="register-phone">Phone Number</label>
          <div class="input-with-icon">
            <input type="tel" id="register-phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>
            <i class="fas fa-phone"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-with-icon">
            <input type="password" id="register-password" name="password" placeholder="Create a password" required>
            <i class="fas fa-lock"></i>
            <i class="toggle-password fas fa-eye" onclick="togglePassword('register-password')"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-auth">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Tab switching
      const loginTab = document.querySelector('[data-tab="login"]');
      const registerTab = document.querySelector('[data-tab="register"]');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');

      loginTab.addEventListener('click', function () {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
      });

      registerTab.addEventListener('click', function () {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
      });

      // Flash messages
      const flashMessages = document.querySelector('.flash-messages');
      if (flashMessages) {
        setTimeout(() => {
          flashMessages.style.opacity = '0';
          setTimeout(() => flashMessages.remove(), 500);
        }, 3000);
      }
    });

    // Toggle password visibility
    function togglePassword(inputId) {
      const passwordInput = document.getElementById(inputId);
      const toggleIcon = passwordInput.nextElementSibling.nextElementSibling;
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }
  </script>
</body>

</html>
