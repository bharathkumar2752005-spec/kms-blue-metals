<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Crushers and Construction</title>
    <link rel="stylesheet" href="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Roboto', Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("../pics/stone-crusher-plant.jpg") no-repeat center center;
    background-size: cover;
    filter: brightness(0.3) contrast(1.2);
    z-index: -2;
}

.particles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

/* Header Styles */
.header {
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

.logo i {
    color: #ffcc00;
    margin-right: 10px;
    font-size: 1.8rem;
}

/* Main Container */
.container {
    max-width: 1200px;
    margin: 20px auto 80px;
    padding: 40px;
    background: rgba(15, 15, 15, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: fadeIn 1s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Title Styles */
.title {
    font-family: 'Montserrat', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 15px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    position: relative;
}

.title span {
    color: #ffcc00;
    position: relative;
    display: inline-block;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
    }
}

.subtitle {
    text-align: center;
    font-size: 1.2rem;
    color: #aaa;
    margin-bottom: 50px;
    font-weight: 300;
}

/* Services Grid */
.services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
}

.service-card {
    background: linear-gradient(145deg, rgba(30, 30, 30, 0.8), rgba(20, 20, 20, 0.8));
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.05);
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.service-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    background: linear-gradient(145deg, rgba(40, 40, 40, 0.9), rgba(30, 30, 30, 0.9));
}

.card-icon {
    font-size: 2.5rem;
    color: #ffcc00;
    margin-bottom: 20px;
    transition: all 0.3s ease;
}

.service-card:hover .card-icon {
    transform: scale(1.1);
}

.service-card h3 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.5rem;
    margin-bottom: 15px;
    color: #fff;
    position: relative;
    padding-bottom: 15px;
}

.service-card h3::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffcc00, transparent);
}

.service-card p {
    color: #bbb;
    font-size: 0.95rem;
    margin-bottom: 20px;
}

.card-overlay {
    position: absolute;
    bottom: -50px;
    left: 0;
    width: 100%;
    padding: 15px;
    background: linear-gradient(to top, rgba(255, 204, 0, 0.9), rgba(255, 204, 0, 0.7));
    color: #000;
    font-weight: 600;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    opacity: 0;
}

.service-card:hover .card-overlay {
    bottom: 0;
    opacity: 1;
}

/* Back Button */
.back-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(145deg, #333, #222);
    color: #fff;
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 40px auto 20px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.back-button:hover {
    background: linear-gradient(145deg, #444, #333);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.back-button:active {
    transform: translateY(-1px);
}

/* Contact Info */
.contact-info {
    text-align: center;
    margin-top: 30px;
    color: #aaa;
    font-size: 0.9rem;
}

.contact-info a {
    color: #ffcc00;
    text-decoration: none;
    transition: color 0.3s ease;
}

.contact-info a:hover {
    color: #fff;
    text-decoration: underline;
}

/* Footer */
.footer {
    text-align: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.7);
    color: #777;
    position: absolute;
    bottom: 0;
    width: 100%;
    font-size: 0.9rem;
}

/* Responsive Styles */
@media (max-width: 992px) {
    .container {
        padding: 30px;
        margin: 20px 20px 80px;
    }
    
    .title {
        font-size: 2.5rem;
    }
}

@media (max-width: 768px) {
    .header {
        padding: 15px 20px;
    }
    
    .logo {
        font-size: 1.2rem;
    }
    
    .title {
        font-size: 2rem;
    }
    
    .subtitle {
        font-size: 1rem;
        margin-bottom: 30px;
    }
    
    .services-grid {
        gap: 20px;
    }
}

@media (max-width: 576px) {
    .container {
        padding: 20px;
    }
    
    .title {
        font-size: 1.8rem;
    }
    
    .service-card {
        padding: 20px;
    }
    
    .card-icon {
        font-size: 2rem;
    }
    
    .service-card h3 {
        font-size: 1.3rem;
    }
    
    .back-button {
        padding: 12px 25px;
        font-size: 0.9rem;
    }
}

    </style>
</head>

<body>
    <div class="particles-container" id="particles-js"></div>
    
    <header class="header">
        <div class="logo">
            <i class="fas fa-hard-hat"></i>
            <span>STONE MASTER</span>
        </div>
    </header>

    <div class="container">
        <h1 class="title">Stone Crushers <span>&</span> Granite Fabrication</h1>
        <p class="subtitle">Premium quality Granite  for all your needs</p>
        
        <div class="services-grid">
            <div class="service-card" onclick="location.href='/shop'">
                <div class="card-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <h3>Product Sales</h3>
                <p>High-quality stone products for all construction needs</p>
                <div class="card-overlay">
                    <span>Explore Products</span>
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>
            
       
            
            
        </div>
        
        <button class="back-button" onclick="location.href='{{ url_for('home') }}'">
            <i class="fas fa-chevron-left"></i> Back to Home
        </button>
        
        <div class="contact-info">
            <p>Need assistance? Contact us: <a href="tel:+1234567890">9566943637</a></p>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; 2023 kms blue metals. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 80,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": "#ffffff"
                    },
                    "opacity": {
                        "value": 0.3,
                        "random": false
                    },
                    "size": {
                        "value": 3,
                        "random": true
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#ffffff",
                        "opacity": 0.2,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 2,
                        "direction": "none",
                        "random": false,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    }
                },
                "retina_detect": true
            });
        });
    </script>
</body>

</html>
