<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
        }
        
        .view-cart {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .view-cart:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .product-grid {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        
        .product-grid th {
            background-color: #f8f9fa;
            text-align: left;
            padding: 1rem;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #e9ecef;
        }
        
        .product-grid td {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        
        .product-grid tr:hover {
            background-color: #f1f8ff;
        }
        
        .add-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .add-btn:hover {
            background-color: #219653;
        }
        
        .price {
            font-weight: bold;
            color: #2c3e50;
        }
        
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        /* Responsive styles */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .product-grid {
                display: block;
                overflow-x: auto;
            }
            
            .product-grid th, 
            .product-grid td {
                padding: 0.75rem;
                font-size: 0.9rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .product-grid th, 
            .product-grid td {
                padding: 0.5rem;
                font-size: 0.85rem;
            }
            
            .add-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
        }
        .views-cart {
            margin-left: 50%;
            display: inline-block;
            background-color: #be1c1c;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .views-cart:hover {
            background-color: #f80000;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Shop</h1>
            <a href="{{ url_for('cart') }}" class="view-cart">View Cart</a>
        </header>
        
        <main>
            <table class="product-grid">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Stocks Available</th>
                        <th>Price per Unit</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for product in products %}
                    <tr>
                        <td>{{ product.name }}</td>
                        <td>{{ product.unit }}</td>
                        <td class="price">₹{{ product.price_per_unit }}</td>
                        <td>
                            <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="add-btn">Add to Cart</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </main>
        <a href="{{ url_for('home') }}" class="views-cart">Back</a>
        <footer>
            <p>&copy; 2025 tpm blue metals. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
