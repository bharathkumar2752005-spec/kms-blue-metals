<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Granite</title>
</head>
<body>
    <h1>Order Granite</h1>
    <p><strong>Granite Type:</strong> {{ granite.name }}</p>
    <p><strong>Price per Sq. Ft.:</strong> {{ granite.price_per_sqft }}</p>
    <form action="{{ url_for('order_granite') }}" method="POST">
        <input type="hidden" name="granite_id" value="{{ granite.id }}">
        <label for="square_feet">Enter Square Feet:</label>
        <input type="number" id="square_feet" name="square_feet" min="1" required>
        <button type="submit">Calculate Price</button>
    </form>
</body>
</html>
